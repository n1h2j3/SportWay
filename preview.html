<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مراجعة وتدقيق تصاميم الفريق بالكامل - SportWay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Anton&family=Barlow+Condensed:wght@700;900&family=Bebas+Neue&family=Cairo:wght@700;900&family=Changa:wght@700;800&family=Montserrat:wght@800;900&family=Readex+Pro:wght@600;700&family=Russo+One&family=Tajawal:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #0a1118;
            --bg-surface: #101922;
            --bg-elevated: #18232f;
            --border-subtle: #223242;
            --text-primary: #e6ebed;
            --text-secondary: #9cb0bf;
            --accent-gold: #baa58c;
            --accent-green: #2e7d32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-unit { display: flex; align-items: center; gap: 12px; }
        .brand-text h1 { font-size: 16px; font-weight: 700; }
        .brand-text p { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        .header-actions { display: flex; gap: 10px; }

        .btn {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 9px 18px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn:hover { background-color: #243547; }
        .btn-success { background-color: var(--accent-green); border: none; }
        .btn-success:hover { background-color: #388e3c; }

        main {
            flex: 1;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .summary-bar {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
        }

        .card-preview-area {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: #0d1620;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-details {
            padding: 12px 16px;
            background-color: var(--bg-elevated);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info-title { font-size: 14px; font-weight: 700; }
        .badge-size {
            background-color: var(--accent-gold);
            color: #0a1118;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .empty-state-box {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background-color: var(--bg-surface);
            border: 1px dashed var(--border-subtle);
            border-radius: 10px;
        }
        .empty-state-box h3 { margin-bottom: 10px; font-size: 16px; color: var(--accent-gold); }
        .empty-state-box p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
        /* ---- بطاقة اللاعب: المعاينة بنفس نسبة الباترون الحقيقية ---- */
        .stage {
            position: relative; width: 100%;
            container-type: size;            /* لتكون أحجام الخطوط نسبة من ارتفاع الباترون (cqh) مثل ملف الطباعة تماماً */
            background: #fff; overflow: hidden;
        }
        .stage > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .ov { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none; font-weight: bold; line-height: 1.2; }
        .stage { cursor: pointer; }
        .edit-hint { position: absolute; top: 8px; inset-inline-start: 8px; background: rgba(10,17,24,.85); color: var(--accent-gold); font-size: 11px; padding: 4px 10px; border-radius: 12px; opacity: 0; transition: .2s; pointer-events: none; z-index: 5; }
        .stage:hover .edit-hint { opacity: 1; }
        .card.modified { border-color: var(--accent-gold); }
        .mod-dot { color: var(--accent-gold); font-size: 11px; margin-inline-start: 6px; }
        .edit-panel { padding: 10px 14px 14px; background: var(--bg-surface); border-top: 1px solid var(--border-subtle); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .edit-panel .full { grid-column: 1 / -1; }
        .edit-panel label { font-size: 10px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 4px; }
        .edit-panel input { background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 6px 8px; border-radius: 4px; font-size: 12px; outline: none; font-family: inherit; min-width: 0; }
        .edit-panel input:focus { border-color: var(--accent-gold); }
        .edit-panel .reset { grid-column: 1 / -1; font-size: 11px; padding: 5px; justify-content: center; }
        .banner { border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 12px; line-height: 1.8; display: none; }
        .banner.warn { background: #3a2f12; border: 1px solid #7a6320; color: #f3d98b; }
        .banner.err { background: #3a1818; border: 1px solid #7a2a2a; color: #f1a5a5; }
    </style>
</head>
<body>

<header>
    <div class="brand-unit">
        <div class="brand-text">
            <h1>مراجعة وتدقيق التصاميم — مقاس M</h1>
            <p>يمكنكم تعديل أي لاعب بشكل فردي من تحت بطاقته، دون التأثير على بقية الفريق</p>
        </div>
    </div>
    <div class="header-actions">
        <a href="editor.html" class="btn">✏️ العودة للمحرر</a>
        <button class="btn btn-success" id="exportBtn" onclick="exportAll()">🖨️ إصدار ملفات كل المقاسات</button>
    </div>
</header>

<main>
    <div id="serverBanner" class="banner err"></div>
    <div id="warnBanner" class="banner warn"></div>

    <div class="summary-bar" style="flex-wrap:wrap; gap:12px;">
        <div>
            <span>إجمالي الفريق: </span>
            <strong id="allCount" style="color: var(--accent-gold); font-size: 15px;">0</strong>
            <span style="color:var(--text-secondary); font-size:12px;"> &nbsp;|&nbsp; جاهز للطباعة: <span id="totalCount">0</span></span>
        </div>
        <div id="exportBar" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>

    <div id="cardsContainer" class="roster-grid"></div>
</main>

<script>
    const API = 'http://127.0.0.1:5000';
    const SIZES = ['S', 'M', 'L', 'XL'];
    let designs = {};
    try { designs = JSON.parse(localStorage.getItem('sportway_designs') || '{}'); } catch (e) {}
    const designOf = sz => designs[sz];

    let roster = JSON.parse(localStorage.getItem('sportway_roster') || '[]');
    const cards = []; // مراجع العناصر لكل لاعب M

    const REGULAR_ONLY = ['Bebas Neue', 'Anton', 'Russo One'];
    const weightOf = f => REGULAR_ONLY.includes(f) ? 'normal' : 'bold';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const sizeOf = p => String(p.jerseySize || p.size || 'M').trim().toUpperCase();
    const saveRoster = () => localStorage.setItem('sportway_roster', JSON.stringify(roster));

    function showBanner(id, html) {
        const b = document.getElementById(id);
        b.innerHTML = html; b.style.display = html ? 'block' : 'none';
    }

    // ---- القيم الفعلية للاعب (الأصلية + التعديل الفردي) ----
    function effective(p) {
        const e = p.edit || {};
        const d = designOf(sizeOf(p));
        const nameCfg = d.nameConfig, numCfg = d.numberConfig;
        return {
            name: e.name ?? p.name, number: e.number ?? p.number,
            nameScale: (e.nameScale ?? 100) / 100, numScale: (e.numScale ?? 100) / 100,
            nameCfg: { ...nameCfg, ...(e.nameCfg || {}) },   // تعديل فردي (مكان/حجم/خط) إن وُجد
            numCfg: { ...numCfg, ...(e.numCfg || {}) }
        };
    }

    // ---- رسم/تحديث نص فوق الباترون (نفس منطق الاحتواء التلقائي في السيرفر) ----
    function paintText(el, stage, cfg, text, userScale) {
        el.textContent = text;
        el.style.left = cfg.centerXPercent + '%';
        el.style.top = cfg.centerYPercent + '%';
        el.style.fontFamily = `'${cfg.fontFamily}', 'Cairo', sans-serif`;
        el.style.fontWeight = weightOf(cfg.fontFamily);
        el.style.color = cfg.fill;
        el.style.webkitTextStroke = (cfg.strokeRel || 0) > 0 ? `calc(${cfg.strokeRel * userScale} * 100cqh) ${cfg.stroke}` : '0';
        // 1) قياس بحجم الخط الأساسي
        el.style.fontSize = `calc(${cfg.relativeFontSize} * 100cqh)`;
        const boxPx = (cfg.widthPercent / 100) * stage.clientWidth;
        const w = el.offsetWidth;
        const fit = (w > boxPx && w > 0) ? boxPx / w : 1;
        // 2) تطبيق الاحتواء ثم تعديل الموظف
        el.style.fontSize = `calc(${cfg.relativeFontSize * fit * userScale} * 100cqh)`;
        el.dataset.fit = fit;
    }

    function refreshCard(c) {
        const v = effective(c.player);
        paintText(c.nameEl, c.stage, v.nameCfg, v.name, v.nameScale);
        paintText(c.numEl, c.stage, v.numCfg, v.number, v.numScale);
        const modified = !!(c.player.edit && Object.keys(c.player.edit).length);
        c.card.classList.toggle('modified', modified);
        c.title.innerHTML = `${esc(v.name)} (#${esc(v.number)})` + (modified ? '<span class="mod-dot">● معدّل</span>' : '');
        const fit = parseFloat(c.nameEl.dataset.fit);
        c.fitNote.textContent = fit < 1 ? `⚠️ الاسم طويل: صُغّر تلقائياً إلى ${Math.round(fit * 100)}%` : '';
    }

    function onEdit(c) {
        const f = c.fields, p = c.player, e = { ...(p.edit || {}) };
        delete e.name; delete e.number;
        if (f.name.value.trim() !== String(p.name ?? '')) e.name = f.name.value.trim();
        if (f.number.value.trim() !== String(p.number ?? '')) e.number = f.number.value.trim();
        if (Object.keys(e).length) p.edit = e; else delete p.edit;
        saveRoster();
        refreshCard(c);
    }

    function resetCard(c) {
        delete c.player.edit;
        c.fields.name.value = c.player.name ?? ''; c.fields.number.value = c.player.number ?? '';
        saveRoster();
        refreshCard(c);
    }

    const openEditor = idx => { location.href = `editor.html?player=${idx}`; };

    function buildCard(player, idx) {
        const card = document.createElement('div');
        card.className = 'card';
        const sz = sizeOf(player);

        const design = designOf(sz);
        if (!design) {
            card.innerHTML = `
                <div class="card-preview-area" style="height:200px; flex-direction:column; color:#778899;">
                    <span style="font-size:30px;">⏳</span>
                    <div style="margin-top:10px; font-weight:bold; color:#e6ebed;">${esc(player.name)} (#${esc(player.number)})</div>
                    <div style="font-size:11px; margin-top:4px;">لا يوجد تصميم لمقاس (${esc(sz)}) — ارجعوا للمحرر وارفعوا باترون هذا المقاس</div>
                </div>
                <div class="card-details"><div class="player-info-title">${esc(player.name)} (#${esc(player.number)})</div>
                <span class="badge-size" style="background:#334455; color:#fff;">${esc(sz)}</span></div>`;
            return { card };
        }

        const pattern = design.pattern || { wPt: 3, hPt: 4 };
        const staticHtml = (design.staticElements || []).map(el => {
            if (el.type === 'image') {
                return `<img src="${API}/api/asset/${esc(el.assetId)}" style="position:absolute; left:${el.centerXPercent}%; top:${el.centerYPercent}%; width:${el.widthPercent}%; transform:translate(-50%,-50%); pointer-events:none;">`;
            }
            return `<div class="ov" data-static="1" style="left:${el.centerXPercent}%; top:${el.centerYPercent}%; font-family:'${esc(el.fontFamily)}',sans-serif; font-size:calc(${el.relativeFontSize} * 100cqh); color:${esc(el.fill)}; -webkit-text-stroke:${(el.strokeRel || 0) > 0 ? `calc(${el.strokeRel} * 100cqh) ${esc(el.stroke)}` : '0'};">${esc(el.text)}</div>`;
        }).join('');

        card.innerHTML = `
            <div class="stage" style="aspect-ratio:${pattern.wPt} / ${pattern.hPt};" title="اضغط لتعديل هذا التيشيرت">
                <span class="edit-hint">✏️ اضغط لتعديل هذا التيشيرت</span>
                <img class="bg" src="${API}/api/template-preview/${sz}?w=900&t=${Date.now()}" onerror="window.__bgFail && window.__bgFail()">
                ${staticHtml}
                <div class="ov" data-role="name"></div>
                <div class="ov" data-role="num"></div>
            </div>
            <div class="card-details">
                <div class="player-info-title"></div>
                <span class="badge-size">${esc(sz)}</span>
            </div>
            <div class="edit-panel">
                <label>الاسم على التيشيرت<input type="text" data-f="name" value="${esc(player.name)}"></label>
                <label>الرقم<input type="text" data-f="number" value="${esc(player.number)}"></label>
                <button class="btn full" data-edit style="justify-content:center; background:#1e2c3a; border-color:#31465c;">✏️ فتح هذا التيشيرت في المحرر (مكان / حجم / خط)</button>
                <div data-fit style="grid-column:1/-1; font-size:11px; color:#f3d98b; min-height:14px;"></div>
                <button class="btn reset" data-reset>↺ استرجاع بيانات الجدول الأصلية</button>
            </div>`;

        const c = {
            card, player,
            stage: card.querySelector('.stage'),
            nameEl: card.querySelector('[data-role=name]'),
            numEl: card.querySelector('[data-role=num]'),
            title: card.querySelector('.player-info-title'),
            fitNote: card.querySelector('[data-fit]'),
            fields: {}
        };
        card.querySelectorAll('[data-f]').forEach(i => { c.fields[i.dataset.f] = i; i.addEventListener('input', () => onEdit(c)); });
        card.querySelector('[data-reset]').addEventListener('click', () => resetCard(c));
        card.querySelector('[data-edit]').addEventListener('click', () => openEditor(idx));
        c.stage.addEventListener('click', () => openEditor(idx));
        return c;
    }

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';
        cards.length = 0;
        document.getElementById('totalCount').innerText = roster.filter(p => designOf(sizeOf(p))).length;
        document.getElementById('allCount').innerText = roster.length;
        buildExportBar();

        if (roster.length === 0 || !Object.keys(designs).length) {
            container.innerHTML = `
                <div class="empty-state-box">
                    <h3>⚠️ ${roster.length === 0 ? 'لا يوجد لاعبون مسجلون' : 'لم يتم اعتماد تصميم من المحرر'}</h3>
                    <p>${roster.length === 0 ? 'ابدؤوا من صفحة الجدول وأدخلوا اللاعبين.' : 'ارجعوا للمحرر وحددوا مكان الاسم والرقم ثم اضغطوا «تأكيد واعتماد التصميم».'}</p>
                    <div style="display:flex; justify-content:center; gap:12px;">
                        <a href="index.html" class="btn" style="background:#2e7d32; border:none;">📋 صفحة الجدول</a>
                        <a href="editor.html" class="btn">✏️ المحرر</a>
                    </div>
                </div>`;
            return;
        }

        roster.forEach((p, idx) => {
            const c = buildCard(p, idx);
            container.appendChild(c.card);
            if (c.stage) { cards.push(c); }
        });
        // بعد إضافة البطاقات للصفحة نقيس ونرسم (القياس يحتاج أن تكون ظاهرة)
        (document.fonts ? document.fonts.ready : Promise.resolve()).then(refreshAll);
    }

    function refreshAll() { cards.forEach(refreshCard); }
    window.addEventListener('resize', refreshAll);

    window.__bgFail = function () {
        showBanner('serverBanner', '⚠️ تعذّر تحميل صورة الباترون من السيرفر. شغّلوا <b>python print_server.py</b> وتأكدوا أن الباترون مرفوع في المحرر، ثم حدّثوا الصفحة.');
        window.__bgFail = null;
    };

    // ---- إصدار ملفات الطباعة (ملف مستقل لكل مقاس) ----
    function buildExportBar() {
        const bar = document.getElementById('exportBar');
        bar.innerHTML = '';
        SIZES.forEach(sz => {
            const n = roster.filter(p => sizeOf(p) === sz).length;
            if (!n) return;
            const b = document.createElement('button');
            b.className = 'btn' + (designOf(sz) ? ' btn-success' : '');
            b.disabled = !designOf(sz);
            b.textContent = designOf(sz) ? `🖨️ ${sz} (${n})` : `${sz} (${n}) — بدون تصميم`;
            b.onclick = () => exportSize(sz);
            bar.appendChild(b);
        });
    }

    async function exportSize(size) {
        const players = roster.filter(p => sizeOf(p) === size);
        const design = designOf(size);
        if (!design) { alert(`لا يوجد تصميم لمقاس ${size}.`); return false; }
        if (!players.length) return false;
        try {
            const response = await fetch(`${API}/api/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    size, roster, masterConfig: design,
                    orderTitle: localStorage.getItem('sportway_order_title') || 'SportWay'
                })
            });
            if (!response.ok) {
                const err = await response.json().catch(() => ({}));
                alert(`مقاس ${size}: حدث خطأ أثناء التجهيز — ` + (err.message || response.status));
                return false;
            }
            let warnings = [];
            try { warnings = JSON.parse(decodeURIComponent(response.headers.get('X-Print-Warnings') || '[]')); } catch (e) {}
            const blob = await response.blob();
            const cd = response.headers.get('Content-Disposition') || '';
            const m = cd.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
            const filename = m ? decodeURIComponent(m[1]) : `SportWay_${size}.pdf`;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            if (warnings.length) {
                const box = document.getElementById('warnBanner');
                box.innerHTML = (box.innerHTML ? box.innerHTML + '<br>' : '<b>تنبيهات على ملفات الطباعة:</b><br>') + `<b>[${size}]</b><br>• ` + warnings.map(esc).join('<br>• ');
                box.style.display = 'block';
            }
            return true;
        } catch (err) {
            alert('تأكدوا من تشغيل السيرفر: python print_server.py');
            return false;
        }
    }

    async function exportAll() {
        const btn = document.getElementById('exportBtn');
        const original = btn.innerHTML;
        btn.disabled = true;
        showBanner('warnBanner', '');
        for (const sz of SIZES) {
            if (!roster.some(p => sizeOf(p) === sz) || !designOf(sz)) continue;
            btn.innerHTML = `⏳ جاري توليد مقاس ${sz}...`;
            await exportSize(sz);
            await new Promise(r => setTimeout(r, 600)); // مهلة قصيرة حتى لا يمنع المتصفح التحميلات المتتالية
        }
        btn.innerHTML = original;
        btn.disabled = false;
    }

    renderCards();
</script>

</body>
</html>
