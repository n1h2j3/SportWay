<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محرر ومطابقة التصميم على الباترون - SportWay</title>
    <!-- استدعاء المكتبات الضرورية للمحرر -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Anton&family=Barlow+Condensed:wght@700;900&family=Bebas+Neue&family=Cairo:wght@700;900&family=Changa:wght@700;800&family=Montserrat:wght@800;900&family=Readex+Pro:wght@600;700&family=Russo+One&family=Tajawal:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #0a1118;
            --bg-surface: #101922;
            --bg-elevated: #18232f;
            --border-subtle: #223242;
            --text-primary: #e6ebed;
            --text-secondary: #9cb0bf;
            --accent-gold: #baa58c;
            --accent-green: #2e7d32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title { font-size: 15px; font-weight: 700; }
        .header-actions { display: flex; gap: 10px; }

        .btn {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover { background-color: #243547; }
        .btn-success { background-color: var(--accent-green); border: none; }
        .btn-success:hover { background-color: #388e3c; }

        .editor-container {
            flex: 1;
            display: flex;
            height: calc(100vh - 57px);
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border-subtle);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .control-row select, .control-row input[type="text"], .control-row input[type="number"] {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .color-picker-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-box input[type="color"] {
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .canvas-area {
            flex: 1;
            background-color: #0d1620;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .canvas-wrapper {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .canvas-hint {
            position: absolute;
            bottom: 15px;
            font-size: 11px;
            color: var(--text-secondary);
            background: rgba(16, 25, 34, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
        }
        .size-tab { background: var(--bg-elevated, #18232f); color: var(--text-secondary, #9cb0bf); border: 1px solid var(--border-subtle, #223242); padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; margin-inline-start: 6px; font-family: inherit; }
        .size-tab:hover { color: var(--text-primary, #e6ebed); }
        .size-tab.active { background: var(--accent-gold, #baa58c); color: #0a1118; border-color: var(--accent-gold, #baa58c); }
    </style>
</head>
<body>

<header>
    <div class="header-actions">
        <a href="index.html" class="btn" id="backBtn">➔ القائمة والبيانات</a>
        <button class="btn" id="newDesignBtn" onclick="newDesign()">🆕 تصميم جديد</button>
        <button class="btn" id="resetPlayerBtn" onclick="resetPlayerDesign()" style="display:none">↺ استرجاع التصميم العام</button>
        <button class="btn btn-success" id="confirmBtn" onclick="onConfirm()">تأكيد واعتماد التصاميم ➔</button>
    </div>
    <div class="header-title"><span id="titleText">محرر التصاميم — لكل مقاس باترون وتصميم مستقل</span> <span id="sizeTabs"></span></div>
</header>

<div class="editor-container">
    <aside class="sidebar">
        <div id="playerInfo" style="display:none; background:#1c2a1d; border:1px solid #2e7d32; border-radius:6px; padding:10px 12px; font-size:12px; line-height:1.9;"></div>

        <div class="sidebar-section" id="secPattern">
            <span class="section-title" id="patternLabel">1. باترون التيشيرت</span>
            <label class="btn" style="cursor: pointer; justify-content: center; background-color: #1e2c3a; border-color: #31465c;">
                📄 رفع ملف الباترون (PDF)
                <input type="file" id="pdfUploadInput" accept="application/pdf" style="display: none;" onchange="loadPdfJersey(event)">
            </label>
            <div id="patternStatus" style="font-size:11px; color:var(--text-secondary);">لم يتم رفع باترون بعد</div>
            <button class="btn" onclick="autoLayout(true)" style="justify-content:center;">🎯 الموضع التلقائي للاسم والرقم</button>
        </div>

        <div class="sidebar-section" id="secElements">
            <span class="section-title">2. العناصر والإضافات</span>
            <button class="btn" onclick="addNewCustomText()">+ إضافة مربع نص</button>
            <label class="btn" style="cursor: pointer; justify-content: center;">
                🖼️ رفع شعار النادي / الرعاة (PNG / JPG)
                <input type="file" id="logoUploadInput" accept="image/png,image/jpeg" style="display: none;" onchange="loadLogoImage(event)">
            </label>
            <div style="font-size:11px; color:var(--text-secondary);">🗑️ للحذف: حدّدوا العنصر واضغطوا <b>Delete</b> في الكيبورد</div>
        </div>

        <div class="sidebar-section">
            <span class="section-title">3. تخصيص الخطوط والمظهر</span>

            <div class="control-row" id="rowText" style="display:none;">
                <label id="labelText">النص:</label>
                <input type="text" id="textInput" autocomplete="off" oninput="applyText(this.value)">
            </div>

            <div class="control-row">
                <label>نوع الخط:</label>
                <select id="fontSelect" onchange="applyFont(this.value)">
                    <optgroup label="يدعم العربي والإنجليزي">
                        <option value="Cairo">Cairo (رسمي وواضح)</option>
                        <option value="Almarai">Almarai (المراعي ثقيل)</option>
                        <option value="Tajawal">Tajawal (حديث)</option>
                        <option value="Changa">Changa (رياضي عريض)</option>
                        <option value="Readex Pro">Readex Pro (عصري)</option>
                    </optgroup>
                    <optgroup label="إنجليزي وأرقام فقط">
                        <option value="Teko">Teko (رياضي مضغوط)</option>
                        <option value="Bebas Neue">Bebas Neue (كلاسيكي)</option>
                        <option value="Anton">Anton (عريض)</option>
                        <option value="Montserrat">Montserrat (هندسي)</option>
                        <option value="Russo One">Russo One (ثقيل)</option>
                        <option value="Barlow Condensed">Barlow Condensed (ضيق)</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-row">
                <label>لون النص الداخلي:</label>
                <div class="color-picker-box">
                    <input type="color" id="fillColor" value="#000000" oninput="applyFill(this.value)">
                    <input type="text" id="fillHex" value="#000000" maxlength="7" onchange="applyFill(this.value)">
                </div>
            </div>

            <div class="control-row">
                <label>لون الإطار الخارجي (Stroke):</label>
                <div class="color-picker-box">
                    <input type="color" id="strokeColor" value="#000000" oninput="applyStroke(this.value)">
                    <input type="text" id="strokeHex" value="#000000" maxlength="7" onchange="applyStroke(this.value)">
                </div>
            </div>

            <div class="control-row">
                <label>سُمك الإطار (0 = بدون إطار):</label>
                <input type="number" id="strokeWidth" value="0" min="0" max="20" step="0.5" oninput="applyStrokeWidth(this.value)">
            </div>
        </div>
    </aside>

    <main class="canvas-area">
        <div class="canvas-wrapper">
            <canvas id="jerseyCanvas" width="900" height="650"></canvas>
        </div>
        <div class="canvas-hint" id="canvasHint">
            💡 اسحبوا الاسم والرقم إلى مكانهما، وغيّروا الحجم من الزوايا
        </div>
    </main>
</div>

<script>
    const API = 'http://127.0.0.1:5000';
    const SIZES = ['S', 'M', 'L', 'XL'];
    const themeAccent = '#baa58c';
    const FONT_FAMILIES = ['Cairo', 'Almarai', 'Tajawal', 'Changa', 'Readex Pro', 'Teko', 'Bebas Neue', 'Anton', 'Montserrat', 'Russo One', 'Barlow Condensed'];
    // هذه الخطوط لها وزن عادي فقط (لا نسمح للمتصفح بتغليظها صناعياً حتى يطابق ملف الطباعة)
    const REGULAR_ONLY = ['Bebas Neue', 'Anton', 'Russo One'];
    const weightOf = f => REGULAR_ONLY.includes(f) ? 'normal' : 'bold';
    // حدود القطعة الخلفية (نسب من الصفحة) محسوبة من باترونات المصنع — تُستخدم إذا تعذّر التحليل من السيرفر
    const BACK_BOX_FALLBACK = { S: [0, 0, 0.4908, 0.5162], M: [0, 0, 0.4912, 0.5146], L: [0.2704, 0, 0.6289, 1], XL: [0.2727, 0, 0.6304, 1] };

    const params = new URLSearchParams(location.search);
    const IS_PLAYER = params.has('player');
    const PLAYER_IDX = IS_PLAYER ? parseInt(params.get('player'), 10) : -1;
    const normSize = v => String(v || 'M').trim().toUpperCase();
    let currentSize = normSize(params.get('size') || sessionStorage.getItem('sportway_cur_size') || 'M');
    if (!SIZES.includes(currentSize)) currentSize = 'M';

    let memDesigns = {};   // مقاس -> إعدادات التصميم
    let uploaded = [];     // المقاسات التي رُفع لها باترون في هذه الجلسة
    try { uploaded = JSON.parse(sessionStorage.getItem('sportway_uploaded') || '[]'); } catch (e) {}
    const markUploaded = s => { if (!uploaded.includes(s)) uploaded.push(s); sessionStorage.setItem('sportway_uploaded', JSON.stringify(uploaded)); };

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const canvas = new fabric.Canvas('jerseyCanvas', { width: 900, height: 650, backgroundColor: '#ffffff', preserveObjectStacking: true });
    let patternInfo = null; // { wPt, hPt }

    function flashHint(msg) {
        const h = document.getElementById('canvasHint');
        const old = h.innerText;
        h.innerText = msg;
        setTimeout(() => { h.innerText = old; }, 2500);
    }

    // ---------- العناصر (الإحداثيات كلها نسب مئوية من الباترون) ----------
    const baseCtl = { borderColor: themeAccent, cornerColor: themeAccent, cornerSize: 8, transparentCorners: false, lockRotation: true };

    // عنصر نص مخصص: المركز = مركز النص المرسوم فعلياً (يتفادى مشاكل محاذاة Textbox مع العربي)
    fabric.CText = fabric.util.createClass(fabric.Object, {
        type: 'ctext',
        text: '', fontSize: 40, fontFamily: 'Cairo', fontWeight: 'bold',
        objectCaching: false,
        initialize: function (text, options) {
            this.callSuper('initialize', options || {});
            this.text = String(text ?? '');
            this.updateDims();
        },
        _font: function () { return `${this.fontWeight} ${this.fontSize}px "${this.fontFamily}", Cairo, sans-serif`; },
        updateDims: function () {
            const c = fabric.util.createCanvasElement().getContext('2d');
            c.font = this._font();
            const m = c.measureText(this.text || ' ');
            this._asc = m.fontBoundingBoxAscent || this.fontSize * 0.95;
            this._desc = m.fontBoundingBoxDescent || this.fontSize * 0.35;
            this.set({ width: Math.max(4, m.width), height: this._asc + this._desc });
            this.setCoords();
        },
        _render: function (ctx) {
            ctx.font = this._font();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            if (/[\u0600-\u06FF]/.test(this.text)) ctx.direction = 'rtl';
            const y = (this._asc - this._desc) / 2;   // نفس توسيط الخط الذي يستخدمه المتصفح والسيرفر
            if (this.fill) { ctx.fillStyle = this.fill; ctx.fillText(this.text, 0, y); }
            if (this.stroke && this.strokeWidth > 0) {
                ctx.lineWidth = this.strokeWidth; ctx.strokeStyle = this.stroke; ctx.lineJoin = 'round';
                ctx.strokeText(this.text, 0, y);
            }
        }
    });

    function makeText(text, o) {
        const W = canvas.width, H = canvas.height;
        const t = new fabric.CText(text, {
            ...baseCtl,
            originX: 'center', originY: 'center',
            left: (o.cx / 100) * W, top: (o.cy / 100) * H,
            fontSize: o.rel * H, fontFamily: o.family, fontWeight: weightOf(o.family),
            fill: o.fill || '#000000', stroke: o.stroke || '#000000',
            strokeWidth: (o.strokeRel || 0) * H
        });
        t.setControlsVisibility({ mtr: false, mt: false, mb: false, ml: false, mr: false });
        t.elementRole = o.role;
        canvas.add(t);
        return t;
    }

    function makeImage(src, assetId, o) {
        return new Promise(resolve => {
            fabric.Image.fromURL(src, img => {
                const W = canvas.width, H = canvas.height;
                img.set({ ...baseCtl, originX: 'center', originY: 'center',
                    left: ((o.cx ?? 50) / 100) * W, top: ((o.cy ?? 60) / 100) * H });
                img.scaleToWidth(o.w ? (o.w / 100) * W : W * 0.12);
                img.setControlsVisibility({ mtr: false });
                img.elementRole = 'static_asset';
                img.assetId = assetId;
                canvas.add(img);
                resolve(img);
            }, { crossOrigin: 'anonymous' });
        });
    }

    // ---------- الباترون: الكانفاس يتبع نسبة الباترون الحقيقية ----------
    function fitCanvasToPattern(pw, ph) {
        const area = document.querySelector('.canvas-area');
        const maxW = Math.max(400, Math.min(1100, area.clientWidth - 40));
        const maxH = Math.max(300, area.clientHeight - 80);
        const s = Math.min(maxW / pw, maxH / ph);
        const nw = Math.round(pw * s), nh = Math.round(ph * s);
        const ow = canvas.width, oh = canvas.height;
        if (nw === ow && nh === oh) return;
        const fy = nh / oh;
        canvas.getObjects().forEach(o => {
            o.left *= nw / ow; o.top *= nh / oh;
            if (o.isType('ctext')) {
                o.set({ fontSize: o.fontSize * fy, strokeWidth: (o.strokeWidth || 0) * fy });
                o.updateDims();
            } else { o.scaleX *= fy; o.scaleY *= fy; }
            o.setCoords();
        });
        canvas.setDimensions({ width: nw, height: nh });
    }

    async function renderPatternPdf(arrayBuffer) {
        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
        const page = await pdf.getPage(1);
        const v1 = page.getViewport({ scale: 1 });
        // للعرض فقط: أكبر بُعد ~2200px (الباترون الحقيقي يبقى كما هو في السيرفر)
        const scale = Math.min(2200 / Math.max(v1.width, v1.height), 4);
        const vp = page.getViewport({ scale });
        const tmp = document.createElement('canvas');
        tmp.width = Math.round(vp.width); tmp.height = Math.round(vp.height);
        const ctx = tmp.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, tmp.width, tmp.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;

        fitCanvasToPattern(v1.width, v1.height);
        patternInfo = { wPt: v1.width, hPt: v1.height };

        await new Promise(res => fabric.Image.fromURL(tmp.toDataURL('image/jpeg', 0.88), img => {
            img.set({ left: 0, top: 0, scaleX: canvas.width / img.width, scaleY: canvas.height / img.height, selectable: false, evented: false });
            canvas.setBackgroundImage(img, () => { canvas.renderAll(); res(); });
        }));
        const cm = v => (v / 72 * 2.54).toFixed(1);
        document.getElementById('patternStatus').innerText = `✅ ${cm(v1.width)} × ${cm(v1.height)} سم`;
    }

    function clearCanvas() {
        canvas.discardActiveObject();
        canvas.getObjects().slice().forEach(o => canvas.remove(o));
        canvas.setBackgroundImage(null, () => {});
        patternInfo = null;
        fitCanvasToPattern(900, 650);
        canvas.renderAll();
    }

    // ---------- الموضع التلقائي للاسم والرقم (حسب القطعة الخلفية لكل مقاس) ----------
    async function getBackBox() {
        try {
            const r = await fetch(`${API}/api/analyze-template/${currentSize}`);
            const j = await r.json();
            if (j.success && j.backBox) return j.backBox;
        } catch (e) {}
        return BACK_BOX_FALLBACK[currentSize] || [0, 0, 0.5, 0.5];
    }

    async function autoLayout(manual) {
        if (!patternInfo) { if (manual) alert('ارفعوا باترون هذا المقاس أولاً.'); return; }
        const [x0, y0, x1, y1] = await getBackBox();
        const bw = x1 - x0, bh = y1 - y0, W = canvas.width, H = canvas.height;
        const place = (o, cy, rel) => {
            if (!o) return;
            o.set({ left: (x0 + bw / 2) * W, top: cy * H, fontSize: rel * H, scaleX: 1, scaleY: 1, fill: '#000000', stroke: '#000000', strokeWidth: 0 });
            o.updateDims(); o.setCoords();
        };
        const objs = canvas.getObjects();
        place(objs.find(o => o.elementRole === 'name_placeholder'), y0 + 0.32 * bh, 0.065 * bh);
        place(objs.find(o => o.elementRole === 'number_placeholder'), y0 + 0.60 * bh, 0.28 * bh);
        canvas.renderAll();
        syncControls();
        if (manual) flashHint('تم ضبط الاسم والرقم تلقائياً على القطعة الخلفية');
    }

    async function loadPdfJersey(e) {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        try {
            await renderPatternPdf(await file.arrayBuffer());
        } catch (err) {
            alert('حدث خطأ أثناء قراءة ملف الـ PDF: ' + err.message);
            return;
        }
        // رفع الملف الأصلي للسيرفر ليُستخدم في الطباعة بجودته الكاملة
        const fd = new FormData();
        fd.append('file', file);
        fd.append('size', currentSize);
        try {
            const r = await fetch(`${API}/api/upload-template`, { method: 'POST', body: fd });
            const res = await r.json();
            if (!res.success) throw new Error(res.message);
            markUploaded(currentSize);
            document.getElementById('patternStatus').innerText = `✅ ${res.widthCm} × ${res.heightCm} سم (محفوظ في السيرفر)`;
            if (res.pages > 1) alert('تنبيه: الملف فيه أكثر من صفحة، سيتم استخدام الصفحة الأولى فقط.');
            if (res.rotation) alert('تنبيه: الباترون مدوَّر (Rotation) وسيرفضه السيرفر. صدّروه بدون تدوير.');
            await autoLayout(false);
            buildTabs();
        } catch (err) {
            alert('⚠️ تعذّر رفع الباترون للسيرفر. تأكدوا من تشغيل: python print_server.py\n' + err.message);
        }
    }

    // ---------- الشعارات والنصوص ----------
    async function loadLogoImage(e) {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file) return;
        const fd = new FormData();
        fd.append('file', file);
        try {
            const r = await fetch(`${API}/api/upload-asset`, { method: 'POST', body: fd });
            const res = await r.json();
            if (!res.success) throw new Error(res.message);
            const img = await makeImage(URL.createObjectURL(file), res.assetId, { cx: 50, cy: 60 });
            canvas.setActiveObject(img);
            canvas.renderAll();
        } catch (err) {
            alert('تعذّر رفع الشعار. تأكدوا من تشغيل السيرفر.\n' + err.message);
        }
    }

    function addNewCustomText() {
        const t = makeText('نص إضافي', { cx: 50, cy: 70, rel: 0.03, family: 'Cairo', fill: '#000000', role: 'static_asset' });
        canvas.setActiveObject(t);
        canvas.renderAll();
    }

    // الحذف بالكيبورد (Delete أو Backspace) — لا يحذف الاسم والرقم
    function deleteSelected() {
        const o = canvas.getActiveObject();
        if (!o) return false;
        if (o.elementRole === 'name_placeholder' || o.elementRole === 'number_placeholder') {
            flashHint('الاسم والرقم أساسيان ولا يمكن حذفهما');
            return true;
        }
        canvas.remove(o);
        canvas.discardActiveObject();
        canvas.renderAll();
        return true;
    }
    document.addEventListener('keydown', e => {
        if (e.key !== 'Delete' && e.key !== 'Backspace') return;
        const t = e.target;
        if (t && ['INPUT', 'SELECT', 'TEXTAREA'].includes(t.tagName)) return;
        if (IS_PLAYER) return;
        if (deleteSelected()) e.preventDefault();
    });

    // ---------- أدوات المظهر ----------
    function activeTextObj() {
        const o = canvas.getActiveObject();
        return (o && o.isType('ctext')) ? o : null;
    }
    function applyFont(val) {
        const o = activeTextObj();
        if (!o) return;
        document.fonts.load(`${weightOf(val)} 40px "${val}"`).then(() => {
            o.set({ fontFamily: val, fontWeight: weightOf(val) });
            o.updateDims();
            canvas.requestRenderAll();
        });
    }
    function applyFill(val) {
        document.getElementById('fillHex').value = val;
        if (/^#[0-9a-f]{6}$/i.test(val)) document.getElementById('fillColor').value = val;
        const o = activeTextObj();
        if (o) { o.set('fill', val); canvas.requestRenderAll(); }
    }
    function applyStroke(val) {
        document.getElementById('strokeHex').value = val;
        if (/^#[0-9a-f]{6}$/i.test(val)) document.getElementById('strokeColor').value = val;
        const o = activeTextObj();
        if (o) { o.set('stroke', val); canvas.requestRenderAll(); }
    }
    function applyStrokeWidth(val) {
        const o = activeTextObj();
        if (o) { o.set('strokeWidth', Math.max(0, parseFloat(val) || 0)); canvas.requestRenderAll(); }
    }
    function applyText(val) {
        const o = activeTextObj();
        if (o) { o.set('text', val); o.updateDims(); canvas.requestRenderAll(); }
    }
    function syncControls() {
        const o = activeTextObj();
        const row = document.getElementById('rowText');
        if (!o) { row.style.display = 'none'; return; }
        row.style.display = '';
        let label = 'النص:';
        const isName = o.elementRole === 'name_placeholder', isNum = o.elementRole === 'number_placeholder';
        if (IS_PLAYER) label = isName ? 'الاسم على هذا التيشيرت:' : (isNum ? 'الرقم على هذا التيشيرت:' : 'النص:');
        else if (isName) label = 'نص الاسم التجريبي — اكتبوا أطول اسم متوقع، فعرضه هو أقصى عرض مسموح:';
        else if (isNum) label = 'الرقم التجريبي:';
        document.getElementById('labelText').innerText = label;
        document.getElementById('textInput').value = o.text;
        document.getElementById('fontSelect').value = o.fontFamily;
        document.getElementById('fillColor').value = o.fill; document.getElementById('fillHex').value = o.fill;
        document.getElementById('strokeColor').value = o.stroke; document.getElementById('strokeHex').value = o.stroke;
        document.getElementById('strokeWidth').value = o.strokeWidth || 0;
    }
    canvas.on('selection:created', syncControls);
    canvas.on('selection:updated', syncControls);
    canvas.on('selection:cleared', syncControls);

    // ---------- تحويل العناصر إلى نسب مئوية من الباترون ----------
    const geom = o => {
        const W = canvas.width, H = canvas.height, c = o.getCenterPoint();
        return {
            centerXPercent: c.x / W * 100, centerYPercent: c.y / H * 100,
            widthPercent: o.getScaledWidth() / W * 100, heightPercent: o.getScaledHeight() / H * 100
        };
    };
    const textCfg = o => {
        const g = geom(o);
        g.widthPercent *= 1.03; // هامش صغير حتى لا يصغّر السيرفر الخط بسبب فروق قياس الخطوط
        return {
            ...g,
            fontFamily: o.fontFamily,
            relativeFontSize: (o.fontSize * (o.scaleY || 1)) / canvas.height,
            fill: o.fill || '#000000', stroke: o.stroke || '#000000',
            strokeRel: ((o.strokeWidth || 0) * (o.scaleY || 1)) / canvas.height
        };
    };
    const cfgSnap = o => {
        const c = textCfg(o); delete c.widthPercent; delete c.heightPercent;
        return JSON.stringify(Object.fromEntries(Object.entries(c).map(([k, v]) => [k, typeof v === 'number' ? Math.round(v * 1000) / 1000 : v])));
    };

    function collectConfig() {
        if (!patternInfo) return null;
        let nameConfig = null, numberConfig = null;
        const staticElements = [];
        for (const o of canvas.getObjects()) {
            if (o.elementRole === 'name_placeholder') nameConfig = { ...textCfg(o), sampleText: o.text };
            else if (o.elementRole === 'number_placeholder') numberConfig = { ...textCfg(o), sampleText: o.text };
            else if (o.isType('image')) {
                if (!o.assetId) continue;
                staticElements.push({ ...geom(o), type: 'image', assetId: o.assetId });
            } else if (o.isType('ctext')) {
                staticElements.push({ ...textCfg(o), type: 'text', text: o.text || '' });
            }
        }
        return { version: 3, size: currentSize, pattern: patternInfo, nameConfig, numberConfig, staticElements };
    }

    async function addStaticFromConfig(el, locked) {
        let o = null;
        if (el.type === 'text') {
            o = makeText(el.text || '', { cx: el.centerXPercent, cy: el.centerYPercent, rel: el.relativeFontSize,
                family: el.fontFamily || 'Cairo', fill: el.fill, stroke: el.stroke, strokeRel: el.strokeRel || 0, role: 'static_asset' });
        } else if (el.type === 'image' && el.assetId) {
            o = await makeImage(`${API}/api/asset/${el.assetId}`, el.assetId, { cx: el.centerXPercent, cy: el.centerYPercent, w: el.widthPercent });
        }
        if (o && locked) { o.set({ selectable: false, evented: false }); o.elementRole = 'context'; }
    }

    // ================= وضع التصميم العام (تبويب لكل مقاس) =================
    function rosterCounts() {
        try {
            const c = {};
            JSON.parse(localStorage.getItem('sportway_roster') || '[]').forEach(p => { const s = normSize(p.jerseySize || p.size); c[s] = (c[s] || 0) + 1; });
            return c;
        } catch (e) { return {}; }
    }

    function buildTabs() {
        const box = document.getElementById('sizeTabs');
        box.innerHTML = '';
        const counts = rosterCounts();
        SIZES.forEach(s => {
            const b = document.createElement('button');
            b.className = 'size-tab' + (s === currentSize ? ' active' : '');
            const done = memDesigns[s] || uploaded.includes(s);
            b.textContent = `${s}${counts[s] ? ` (${counts[s]})` : ''}${done ? ' ✓' : ''}`;
            b.title = counts[s] ? `${counts[s]} لاعب بهذا المقاس` : 'لا يوجد لاعبون بهذا المقاس';
            b.onclick = () => switchSize(s);
            box.appendChild(b);
        });
    }

    async function buildObjects(d) {
        const n = d?.nameConfig || {}, m = d?.numberConfig || {};
        makeText(n.sampleText || 'الاسم التجريبي', {
            cx: n.centerXPercent ?? 50, cy: n.centerYPercent ?? 30, rel: n.relativeFontSize ?? 0.04,
            family: n.fontFamily || 'Cairo', fill: n.fill || '#000000', stroke: n.stroke, strokeRel: n.strokeRel || 0, role: 'name_placeholder'
        });
        makeText(m.sampleText || '10', {
            cx: m.centerXPercent ?? 50, cy: m.centerYPercent ?? 45, rel: m.relativeFontSize ?? 0.12,
            family: m.fontFamily || 'Teko', fill: m.fill || '#000000', stroke: m.stroke, strokeRel: m.strokeRel || 0, role: 'number_placeholder'
        });
        for (const el of (d?.staticElements || [])) await addStaticFromConfig(el, false);
    }

    async function loadSize(size) {
        currentSize = size;
        sessionStorage.setItem('sportway_cur_size', size);
        clearCanvas();
        document.getElementById('patternLabel').innerText = `1. باترون مقاس ${size}`;
        document.getElementById('patternStatus').innerText = `لم يتم رفع باترون لمقاس ${size} بعد`;
        if (uploaded.includes(size)) {
            try {
                const r = await fetch(`${API}/api/template/${size}`);
                if (r.ok) await renderPatternPdf(await r.arrayBuffer());
            } catch (e) { console.warn('السيرفر غير متصل'); }
        }
        await buildObjects(memDesigns[size]);
        if (!memDesigns[size] && patternInfo) await autoLayout(false);
        const nb = canvas.getObjects().find(o => o.elementRole === 'name_placeholder');
        if (nb) canvas.setActiveObject(nb);
        syncControls();
        buildTabs();
        canvas.renderAll();
    }

    async function switchSize(size) {
        if (size === currentSize) return;
        const c = collectConfig();
        if (c) memDesigns[currentSize] = c; else delete memDesigns[currentSize];
        await loadSize(size);
    }

    async function initMaster() {
        // أول دخول لطلبية جديدة = لوحة نظيفة. نسترجع التصاميم فقط عند الرجوع من المعاينة في نفس الجلسة
        const keep = sessionStorage.getItem('sportway_design_active') === '1';
        if (keep) {
            try { memDesigns = JSON.parse(localStorage.getItem('sportway_designs') || '{}'); } catch (e) {}
        } else {
            localStorage.removeItem('sportway_designs');
            localStorage.removeItem('sportway_master_template');
            uploaded = [];
            sessionStorage.setItem('sportway_uploaded', '[]');
        }
        buildTabs();
        await loadSize(currentSize);
    }

    function newDesign() {
        if (!confirm('بدء تصميم جديد؟ سيتم مسح كل التصاميم الحالية (كل المقاسات).')) return;
        localStorage.removeItem('sportway_designs');
        localStorage.removeItem('sportway_master_template');
        sessionStorage.removeItem('sportway_design_active');
        sessionStorage.setItem('sportway_uploaded', '[]');
        location.href = 'editor.html';
    }

    function proceedToPreview() {
        const c = collectConfig();
        if (c) memDesigns[currentSize] = c;
        if (!Object.keys(memDesigns).length) { alert('ارفعوا باترون واحد على الأقل.'); return; }

        const counts = rosterCounts();
        const missing = Object.keys(counts).filter(s => !memDesigns[s]);
        if (missing.length && !confirm(`لا يوجد تصميم للمقاسات: ${missing.map(s => `${s} (${counts[s]} لاعب)`).join('، ')}\nلن تظهر هذه المقاسات في المعاينة. هل تريدون المتابعة؟`)) return;

        localStorage.setItem('sportway_designs', JSON.stringify(memDesigns));
        localStorage.removeItem('sportway_master_template');
        sessionStorage.setItem('sportway_design_active', '1');
        window.location.href = 'preview.html';
    }

    // ================= وضع تعديل تيشيرت واحد فقط =================
    let initialSnap = {};

    function makePlayerText(text, cfg, role) {
        const t = makeText(String(text ?? ''), {
            cx: cfg.centerXPercent, cy: cfg.centerYPercent, rel: cfg.relativeFontSize,
            family: cfg.fontFamily, fill: cfg.fill, stroke: cfg.stroke, strokeRel: cfg.strokeRel || 0, role
        });
        // نفس منطق السيرفر: إذا الاسم أعرض من الصندوق المحدد يصغّر ليحتويه
        const boxW = cfg.widthPercent / 100 * canvas.width;
        if (t.width > boxW && boxW > 0) {
            const k = boxW / t.width;
            t.set({ fontSize: t.fontSize * k, strokeWidth: (t.strokeWidth || 0) * k });
            t.updateDims();
        }
        return t;
    }

    async function initPlayer() {
        const roster = JSON.parse(localStorage.getItem('sportway_roster') || '[]');
        const p = roster[PLAYER_IDX];
        let designs = {};
        try { designs = JSON.parse(localStorage.getItem('sportway_designs') || '{}'); } catch (e) {}
        currentSize = normSize(p?.jerseySize || p?.size);
        const master = designs[currentSize];
        if (!p || !master?.nameConfig || !master?.numberConfig) {
            alert('لا توجد بيانات كافية لهذا المقاس. ارجعوا للمعاينة.');
            location.href = 'preview.html';
            return;
        }
        document.getElementById('titleText').innerText = 'تعديل تيشيرت فردي';
        document.getElementById('sizeTabs').innerText = `— ${p.name} (#${p.number}) | مقاس ${currentSize}`;
        document.getElementById('sizeTabs').style.color = '#baa58c';
        document.getElementById('secPattern').style.display = 'none';
        document.getElementById('secElements').style.display = 'none';
        document.getElementById('newDesignBtn').style.display = 'none';
        document.getElementById('resetPlayerBtn').style.display = '';
        document.getElementById('backBtn').href = 'preview.html';
        document.getElementById('backBtn').innerText = '➔ إلغاء والعودة';
        document.getElementById('confirmBtn').innerText = '💾 حفظ والعودة للمعاينة';
        const info = document.getElementById('playerInfo');
        info.style.display = '';
        info.innerHTML = `✏️ تعديل <b>خاص بهذا التيشيرت فقط</b>.<br>حرّكوا الاسم والرقم، غيّروا حجمهم من الزوايا، وعدّلوا النص أو الخط واللون من القائمة الجانبية. باقي اللاعبين لا يتأثرون.`;

        const r = await fetch(`${API}/api/template/${currentSize}`).catch(() => null);
        if (!r || !r.ok) { alert('تعذّر تحميل الباترون من السيرفر. شغّلوا print_server.py'); location.href = 'preview.html'; return; }
        await renderPatternPdf(await r.arrayBuffer());

        for (const el of (master.staticElements || [])) await addStaticFromConfig(el, true);

        const e = p.edit || {};
        const nameObj = makePlayerText(e.name ?? p.name, { ...master.nameConfig, ...(e.nameCfg || {}) }, 'name_placeholder');
        const numObj = makePlayerText(e.number ?? p.number, { ...master.numberConfig, ...(e.numCfg || {}) }, 'number_placeholder');
        initialSnap = { name: cfgSnap(nameObj), num: cfgSnap(numObj) };
        canvas.setActiveObject(nameObj);
        syncControls();
        canvas.renderAll();
    }

    function savePlayerEdit() {
        const roster = JSON.parse(localStorage.getItem('sportway_roster') || '[]');
        const p = roster[PLAYER_IDX];
        const objs = canvas.getObjects();
        const nameObj = objs.find(o => o.elementRole === 'name_placeholder');
        const numObj = objs.find(o => o.elementRole === 'number_placeholder');
        const e = p.edit || {};

        const nm = (nameObj.text || '').trim(), nb = (numObj.text || '').trim();
        if (nm !== String(p.name ?? '')) e.name = nm; else delete e.name;
        if (nb !== String(p.number ?? '')) e.number = nb; else delete e.number;
        if (cfgSnap(nameObj) !== initialSnap.name) e.nameCfg = textCfg(nameObj);
        if (cfgSnap(numObj) !== initialSnap.num) e.numCfg = textCfg(numObj);
        delete e.nameScale; delete e.numScale;

        if (Object.keys(e).length) p.edit = e; else delete p.edit;
        localStorage.setItem('sportway_roster', JSON.stringify(roster));
        location.href = 'preview.html';
    }

    function resetPlayerDesign() {
        const roster = JSON.parse(localStorage.getItem('sportway_roster') || '[]');
        const p = roster[PLAYER_IDX];
        if (p && p.edit) {
            delete p.edit.nameCfg; delete p.edit.numCfg;
            if (!Object.keys(p.edit).length) delete p.edit;
            localStorage.setItem('sportway_roster', JSON.stringify(roster));
        }
        location.reload();
    }

    const onConfirm = () => IS_PLAYER ? savePlayerEdit() : proceedToPreview();

    async function init() {
        await Promise.all(FONT_FAMILIES.map(f => document.fonts.load(`${weightOf(f)} 40px "${f}"`).catch(() => {})));
        if (IS_PLAYER) await initPlayer(); else await initMaster();
    }
    window.addEventListener('DOMContentLoaded', init);
</script>
