
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة طريق الرياضة | محرر التصميم</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@700;800&family=Anton&family=Barlow+Condensed:wght@700;900&family=Bebas+Neue&family=Chakra+Petch:wght@700&family=Cairo:wght@700;900&family=Changa:wght@700;800&family=Montserrat:wght@800;900&family=Readex+Pro:wght@600;700&family=Russo+One&family=Tajawal:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #0a1118;
            --bg-surface: #101922;
            --bg-elevated: #18232f;
            --border-subtle: #223242;
            --text-primary: #e6ebed;
            --text-secondary: #9cb0bf;
            --accent-beige: #baa58c;
            --accent-beige-hover: #c9b7a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .brand-unit { display: flex; align-items: center; gap: 12px; }
        .brand-unit img { width: 32px; height: 32px; object-fit: contain; }
        .brand-text h1 { font-size: 14px; font-weight: 600; }

        .btn {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .btn:hover { background-color: #223140; }

        .btn-primary {
            background-color: var(--accent-beige);
            color: #0a1118;
            font-weight: 600;
            border: none;
        }

        .btn-primary:hover { background-color: var(--accent-beige-hover); }

        .editor-workspace { flex: 1; display: flex; overflow: hidden; }

        .sidebar {
            width: 320px;
            background-color: var(--bg-surface);
            border-left: 1px solid var(--border-subtle);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-section {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-beige);
        }

        .control-row { display: flex; flex-direction: column; gap: 6px; }
        .control-row label { font-size: 11px; color: var(--text-secondary); }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            background-color: var(--bg-base);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .color-picker-box { display: flex; align-items: center; gap: 8px; }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 38px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .canvas-area {
            flex: 1;
            background-color: #070c12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .canvas-wrapper {
            background-color: #ffffff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            border: 1px solid var(--border-subtle);
        }

        .canvas-hint {
            position: absolute;
            bottom: 12px;
            background: rgba(16, 25, 34, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            pointer-events: none;
        }
    </style>
</head>

<body>

<header>
    <div class="brand-unit">
        <img src="logo.png" alt="Logo" onerror="this.src='logo.png'">
        <div class="brand-text">
            <h1>محرر ومطابقة التصميم على الباترون</h1>
        </div>
    </div>

    <div>
        <a id="backButton" href="index.html" class="btn">➔ القائمة والبيانات</a>
        <button class="btn btn-primary" id="saveButton" onclick="proceedToPreview()">
            تأكيد واعتماد التصميم ➔
        </button>
    </div>
</header>

<div class="editor-workspace">

    <aside class="sidebar">

        <div class="sidebar-section">
            <span class="section-title">1. باترون التيشيرت الأساسي</span>

            <label class="btn" style="cursor:pointer; justify-content:center; background-color:#233547; border-color:#3b536b;">
                📄 رفع ملف الباترون (PDF)
                <input type="file" id="jerseyUpload" accept="application/pdf" style="display:none;" onchange="loadPdfJersey(event)">
            </label>
        </div>

        <div class="sidebar-section">
            <span class="section-title">2. العناصر والإضافات</span>

            <button class="btn" onclick="addNewTextBox('نص إضافي')">
                + إضافة مربع نص
            </button>

            <label class="btn" style="cursor:pointer; justify-content:center;">
                🖼️ رفع شعار النادي / الرعاة
                <input type="file" id="logoUpload" accept="image/*" style="display:none;" onchange="uploadLogo(event)">
            </label>
        </div>

        <div class="sidebar-section">
            <span class="section-title">3. تخصيص الخطوط والمظهر</span>

            <div class="control-row">
                <label>نوع الخط:</label>
                <select id="fontSelect" onchange="applyFont(this.value)">
                    <optgroup label="خطوط رياضية لاتينية">
                        <option value="Teko" selected>Teko</option>
                        <option value="Bebas Neue">Bebas Neue</option>
                        <option value="Impact">Impact</option>
                        <option value="Barlow Condensed">Barlow Condensed</option>
                        <option value="Anton">Anton</option>
                        <option value="Russo One">Russo One</option>
                        <option value="Chakra Petch">Chakra Petch</option>
                        <option value="Montserrat">Montserrat</option>
                    </optgroup>

                    <optgroup label="خطوط عربية">
                        <option value="Cairo">Cairo</option>
                        <option value="Almarai">Almarai</option>
                        <option value="Changa">Changa</option>
                        <option value="Tajawal">Tajawal</option>
                        <option value="Readex Pro">Readex Pro</option>
                    </optgroup>
                </select>
            </div>

            <div class="control-row">
                <label>لون النص الداخلي:</label>
                <div class="color-picker-box">
                    <input type="color" id="fillColor" value="#ffffff" oninput="applyFill(this.value)">
                    <input type="text" id="fillHex" value="#ffffff" maxlength="7" onchange="applyFill(this.value)">
                </div>
            </div>

            <div class="control-row">
                <label>الإطار الخارجي:</label>
                <div class="color-picker-box">
                    <input type="color" id="strokeColor" value="#000000" oninput="applyStroke(this.value)">
                    <input type="text" id="strokeHex" value="#000000" maxlength="7" onchange="applyStroke(this.value)">
                </div>
            </div>

            <div class="control-row">
                <label>سُمك الإطار:</label>
                <input type="number" id="strokeWidth" value="2" min="0" max="25" oninput="applyStrokeWidth(this.value)">
            </div>
        </div>

        <div class="sidebar-section">
            <span class="section-title">أدوات العرض والكانفاس</span>
            <button class="btn" onclick="resetZoom()">🔍 إعادة ضبط مقاس العرض (100%)</button>
        </div>

    </aside>

    <main class="canvas-area">
        <div class="canvas-wrapper">
            <canvas id="tshirtCanvas" width="900" height="650"></canvas>
        </div>

        <div class="canvas-hint">
            💡 استخدم عجلة الماوس للتقريب، واسحب العناصر لوضعها بدقة
        </div>
    </main>

</div>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const canvas = new fabric.Canvas('tshirtCanvas');
    const themeAccent = '#baa58c';

    // بيانات اللاعبين
    const savedRoster = JSON.parse(
        localStorage.getItem('sportway_roster') || '[]'
    );

    // معرفة هل المحرر مفتوح لتعديل لاعب معين
    const params = new URLSearchParams(window.location.search);
    const editPlayerId = params.get('playerId');

    const playerToEdit = savedRoster.find(
        player => String(player.id) === String(editPlayerId)
    );

    const isEditingPlayer = Boolean(playerToEdit);

    const sampleName = isEditingPlayer
        ? playerToEdit.name
        : (savedRoster[0]?.name || 'الوليد');

    const sampleNum = isEditingPlayer
        ? playerToEdit.number
        : (savedRoster[0]?.number || '18');

    // التصاميم الفردية
    let playerDesigns = JSON.parse(
        localStorage.getItem('sportway_player_designs') || '{}'
    );

    // التصميم الفردي أو التصميم الأساسي
    const individualDesign = isEditingPlayer
        ? playerDesigns[editPlayerId]
        : null;

    const baseBg = localStorage.getItem('sportway_current_design_bg');
    const baseLayout = JSON.parse(
        localStorage.getItem('sportway_design_layout') || '[]'
    );

    // عند التعديل نستخدم تصميم اللاعب، أو التصميم الأساسي إذا لم يكن له تصميم
    const designToLoad = individualDesign || (
        isEditingPlayer
            ? { bg: baseBg, layout: baseLayout }
            : null
    );

    // تغيير الأزرار حسب وضع المحرر
    if (isEditingPlayer) {
        document.getElementById('saveButton').textContent =
            '💾 حفظ تعديل اللاعب والعودة للمعاينة';

        document.getElementById('backButton').href = 'preview.html';
        document.getElementById('backButton').textContent =
            '➔ العودة للمعاينة';
    }

    // إنشاء مربع النص
    function createTextBox(text, options = {}) {
        return new fabric.Textbox(text, {
            left: 100,
            top: 180,
            width: 140,
            fontSize: 26,
            fontFamily: 'Cairo',
            fontWeight: 'bold',
            fill: '#ffffff',
            stroke: '#000000',
            strokeWidth: 2,
            textAlign: 'center',
            borderColor: themeAccent,
            cornerColor: themeAccent,
            cornerSize: 7,
            transparentCorners: false,
            ...options
        });
    }

    // إضافة النصوص الافتراضية في التصميم الأساسي
    function addDefaultTextBoxes() {
        const nameBox = createTextBox(sampleName, {
            left: 100,
            top: 180,
            fontSize: 26,
            fontFamily: 'Cairo'
        });

        const numberBox = createTextBox(sampleNum, {
            left: 100,
            top: 230,
            fontSize: 70,
            fontFamily: 'Teko'
        });

        canvas.add(nameBox);
        canvas.add(numberBox);
    }

    // تحميل خلفية التصميم
    function loadBackground(bgDataUrl) {
        return new Promise(resolve => {
            if (!bgDataUrl) {
                resolve(false);
                return;
            }

            fabric.Image.fromURL(bgDataUrl, function(img) {
                if (!img) {
                    resolve(false);
                    return;
                }

                canvas.setBackgroundImage(
                    img,
                    function() {
                        canvas.renderAll();
                        resolve(true);
                    },
                    {
                        originX: 'left',
                        originY: 'top',
                        left: 0,
                        top: 0,
                        scaleX: canvas.width / img.width,
                        scaleY: canvas.height / img.height
                    }
                );
            });
        });
    }

    // تحميل النصوص المحفوظة
    function loadSavedLayout(layout) {
        if (!Array.isArray(layout) || layout.length === 0) {
            return false;
        }

        let nameUsed = false;
        let numberUsed = false;

        layout.forEach(item => {
            if (item.type !== 'text') return;

            let text = item.text || '';

            const isNumber = /^[0-9]+$/.test(String(text).trim());

            // استبدال الاسم والرقم ببيانات اللاعب الحالي
            if (!isNumber && !nameUsed) {
                text = sampleName;
                nameUsed = true;
            } else if (isNumber && !numberUsed) {
                text = sampleNum;
                numberUsed = true;
            }

            const fontSize = Math.max(
                8,
                (item.relativeFontSize || 0.04) * canvas.height
            );

            const centerX = (item.centerXPercent / 100) * canvas.width;
            const centerY = (item.centerYPercent / 100) * canvas.height;

            const box = createTextBox(text, {
                left: centerX,
                top: centerY,
                originX: 'center',
                originY: 'center',
                width: 140,
                fontSize: fontSize,
                fontFamily: item.fontFamily || 'Cairo',
                fill: item.fill || '#ffffff',
                stroke: item.stroke || '#000000',
                strokeWidth: item.strokeWidth || 0
            });

            canvas.add(box);
        });

        return canvas.getObjects('textbox').length > 0;
    }

    // تحميل التصميم عند فتح المحرر
    async function initializeEditor() {
        if (isEditingPlayer && designToLoad) {
            await loadBackground(designToLoad.bg);

            const loaded = loadSavedLayout(designToLoad.layout);

            if (!loaded) {
                addDefaultTextBoxes();
            }

            canvas.renderAll();
        } else {
            addDefaultTextBoxes();
        }
    }

    initializeEditor();

    // حفظ صورة الخلفية في IndexedDB
    function saveImageToDB(dataUrl) {
        const request = indexedDB.open('SportWayDB', 1);

        request.onupgradeneeded = function(e) {
            const db = e.target.result;

            if (!db.objectStoreNames.contains('assets')) {
                db.createObjectStore('assets');
            }
        };

        request.onsuccess = function(e) {
            const db = e.target.result;
            const tx = db.transaction('assets', 'readwrite');

            tx.objectStore('assets').put(dataUrl, 'jersey_bg');
        };
    }

    // رفع ملف PDF
    function loadPdfJersey(e) {
        const file = e.target.files[0];

        if (!file || file.type !== 'application/pdf') return;

        const fileReader = new FileReader();

        fileReader.onload = function() {
            const typedarray = new Uint8Array(this.result);

            pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                pdf.getPage(1).then(function(page) {
                    const viewport = page.getViewport({ scale: 1.5 });

                    const tempCanvas = document.createElement('canvas');
                    const context = tempCanvas.getContext('2d');

                    tempCanvas.height = viewport.height;
                    tempCanvas.width = viewport.width;

                    page.render({
                        canvasContext: context,
                        viewport: viewport
                    }).promise.then(function() {
                        const bgDataUrl = tempCanvas.toDataURL(
                            'image/jpeg',
                            0.85
                        );

                        saveImageToDB(bgDataUrl);

                        fabric.Image.fromURL(bgDataUrl, function(img) {
                            const scale = Math.min(
                                canvas.width / img.width,
                                canvas.height / img.height
                            );

                            canvas.setBackgroundImage(
                                img,
                                canvas.renderAll.bind(canvas),
                                {
                                    scaleX: scale,
                                    scaleY: scale,
                                    left: (canvas.width - img.width * scale) / 2,
                                    top: (canvas.height - img.height * scale) / 2
                                }
                            );
                        });
                    });
                });
            });
        };

        fileReader.readAsArrayBuffer(file);
    }

    // التقريب والتبعيد
    canvas.on('mouse:wheel', function(opt) {
        const delta = opt.e.deltaY;

        let zoom = canvas.getZoom();
        zoom *= 0.999 ** delta;

        if (zoom > 4) zoom = 4;
        if (zoom < 0.8) zoom = 0.8;

        canvas.zoomToPoint(
            { x: opt.e.offsetX, y: opt.e.offsetY },
            zoom
        );

        opt.e.preventDefault();
        opt.e.stopPropagation();
    });

    function resetZoom() {
        canvas.setZoom(1);
        canvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
    }

    // الحذف بزر Delete أو Backspace
    window.addEventListener('keydown', e => {
        if (e.key === 'Delete' || e.key === 'Backspace') {
            const active = canvas.getActiveObject();

            if (active && !active.isEditing) {
                canvas.remove(active);
                canvas.discardActiveObject();
                canvas.renderAll();
            }
        }
    });

    canvas.on('selection:created', syncControls);
    canvas.on('selection:updated', syncControls);

    function syncControls() {
        const active = canvas.getActiveObject();

        if (active && active.isType('textbox')) {
            if (active.fontFamily) {
                document.getElementById('fontSelect').value =
                    active.fontFamily;
            }

            if (active.fill) {
                document.getElementById('fillColor').value = active.fill;
                document.getElementById('fillHex').value = active.fill;
            }

            if (active.stroke) {
                document.getElementById('strokeColor').value = active.stroke;
                document.getElementById('strokeHex').value = active.stroke;
            }

            document.getElementById('strokeWidth').value =
                active.strokeWidth || 0;
        }
    }

    function applyFont(val) {
        const active = canvas.getActiveObject();

        if (active && active.isType('textbox')) {
            active.set('fontFamily', val);
            canvas.renderAll();
        }
    }

    function applyFill(val) {
        if (!/^#[0-9A-Fa-f]{6}$/.test(val)) return;

        document.getElementById('fillColor').value = val;
        document.getElementById('fillHex').value = val;

        const active = canvas.getActiveObject();

        if (active && active.isType('textbox')) {
            active.set('fill', val);
            canvas.renderAll();
        }
    }

    function applyStroke(val) {
        if (!/^#[0-9A-Fa-f]{6}$/.test(val)) return;

        document.getElementById('strokeColor').value = val;
        document.getElementById('strokeHex').value = val;

        const active = canvas.getActiveObject();

        if (active && active.isType('textbox')) {
            active.set('stroke', val);
            canvas.renderAll();
        }
    }

    function applyStrokeWidth(val) {
        const w = parseInt(val, 10) || 0;
        const active = canvas.getActiveObject();

        if (active && active.isType('textbox')) {
            active.set('strokeWidth', w);
            canvas.renderAll();
        }
    }

    // إضافة مربع نص
    function addNewTextBox(text) {
        const box = createTextBox(text, {
            left: 100,
            top: 350,
            width: 140,
            fontSize: 20,
            fontFamily: document.getElementById('fontSelect').value,
            fill: document.getElementById('fillColor').value,
            stroke: document.getElementById('strokeColor').value,
            strokeWidth: parseInt(
                document.getElementById('strokeWidth').value,
                10
            ) || 0
        });

        canvas.add(box);
        canvas.setActiveObject(box);
    }

    // رفع شعار
    function uploadLogo(e) {
        const file = e.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(evt) {
            fabric.Image.fromURL(evt.target.result, function(img) {
                img.scaleToWidth(70);

                img.set({
                    left: 100,
                    top: 120,
                    borderColor: themeAccent,
                    cornerColor: themeAccent,
                    cornerSize: 7,
                    transparentCorners: false
                });

                canvas.add(img);
                canvas.setActiveObject(img);
            });
        };

        reader.readAsDataURL(file);
    }

    // اعتماد التصميم أو حفظ تعديل اللاعب
    function proceedToPreview() {
        if (isEditingPlayer && !playerToEdit) {
            alert('لم يتم العثور على اللاعب المطلوب.');
            return;
        }

        const textObjects = canvas.getObjects('textbox');

        // حفظ مواضع النصوص وأحجامها
        const layout = textObjects.map(obj => {
            const centerPoint = obj.getCenterPoint();

            return {
                type: 'text',
                text: obj.text || '',
                fontFamily: obj.fontFamily || 'Cairo',

                centerXPercent:
                    (centerPoint.x / canvas.width) * 100,

                centerYPercent:
                    (centerPoint.y / canvas.height) * 100,

                relativeFontSize:
                    (obj.fontSize * (obj.scaleY || 1)) / canvas.height,

                fill: obj.fill || '#000000',
                stroke: obj.stroke || '#000000',
                strokeWidth: obj.strokeWidth || 0
            };
        });

        // إخفاء النصوص مؤقتًا لتصوير الخلفية
        textObjects.forEach(obj => obj.visible = false);

        canvas.renderAll();

        const currentDesignBg = canvas.toDataURL({
            format: 'png',
            quality: 0.85
        });

        // إعادة إظهار النصوص
        textObjects.forEach(obj => obj.visible = true);
        canvas.renderAll();

        if (isEditingPlayer) {
            // حفظ تصميم اللاعب بشكل مستقل
            playerDesigns[editPlayerId] = {
                bg: currentDesignBg,
                layout: layout
            };

            localStorage.setItem(
                'sportway_player_designs',
                JSON.stringify(playerDesigns)
            );

        } else {
            // حفظ التصميم الأساسي المشترك
            localStorage.setItem(
                'sportway_current_design_bg',
                currentDesignBg
            );

            localStorage.setItem(
                'sportway_design_layout',
                JSON.stringify(layout)
            );
        }

        window.location.href = 'preview.html';
    }
</script>

</body>
</html>
